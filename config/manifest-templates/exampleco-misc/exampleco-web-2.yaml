apiVersion: apps/v1
kind: Deployment
metadata:
  name: exampleco-web-2
  labels:
    app: exampleco-web-2
    environment: "{{ config.environment }}"
    cluster-id: "{{ config.cluster_id }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exampleco-web-2
  template:
    metadata:
      labels:
        app: exampleco-web-2
        environment: "{{ config.environment }}"
        cluster-id: "{{ config.cluster_id }}"
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: exampleco-web-2
          image: "{{ images.exampleco_web_2 }}"
          ports:
            - containerPort: 80
          env:
            # Environment variables from deployment profile
            {% for key, value in environment_variables.get('exampleco-web-2', {}).items() %}
            - name: {{ key }}
              value: "{{ value }}"
            {% endfor %}
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: exampleco-web-2
  labels:
    app: exampleco-web-2
    environment: "{{ config.environment }}"
spec:
  selector:
    app: exampleco-web-2
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: exampleco-web-2
  labels:
    app: exampleco-web-2
    environment: "{{ config.environment }}"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: exampleco-web-2
                port:
                  number: 80
