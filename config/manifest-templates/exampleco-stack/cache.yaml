apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  labels:
    app: cache
    environment: "{{ config.environment }}"
    cluster-id: "{{ config.cluster_id }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
        environment: "{{ config.environment }}"
        cluster-id: "{{ config.cluster_id }}"
    spec:
      containers:
        - name: cache
          image: "redis:7-alpine"
          command: ["redis-server", "--requirepass", "$(CACHE_PASSWORD)"]
          ports:
            - containerPort: 6379
          env:
            - name: CACHE_PASSWORD
              value: "{{ secrets.cache_password }}"
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: cache
  labels:
    app: cache
    environment: "{{ config.environment }}"
spec:
  selector:
    app: cache
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  type: ClusterIP
