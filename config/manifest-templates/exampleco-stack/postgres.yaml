apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
    environment: "{{ config.environment }}"
    cluster-id: "{{ config.cluster_id }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        environment: "{{ config.environment }}"
        cluster-id: "{{ config.cluster_id }}"
    spec:
      containers:
        - name: postgres
          image: "postgres:16-alpine"
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "exampleco"
            - name: POSTGRES_USER
              value: "exampleco"
            - name: POSTGRES_PASSWORD
              value: "{{ secrets.database_password }}"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - exampleco
                - -d
                - exampleco
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - exampleco
                - -d
                - exampleco
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: postgres-data
          emptyDir: {} # For ephemeral environments, use emptyDir
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
    environment: "{{ config.environment }}"
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  type: ClusterIP
