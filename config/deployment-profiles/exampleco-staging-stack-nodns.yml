version: "1.0"
description: "Example stack deployment, staging-shaped but with no DNS record (Traefik's self-signed certificate)"
manifests_dir: "config/manifest-templates/exampleco-stack"
environment_type: "ephemeral"
resolution_strategy: "branch_discovery_with_fallback"
fallback_branches: ["staging", "dev"]
default_secrets_class: "DEV"
rollout_timeout_seconds: 900

# Hostname configuration - use the provider's host directly. No `provider_host`
# value is known until the cluster actually provisions, so `cluster_hostname`
# is deliberately OMITTED from the resolved config until deploy time
# (DR-0025) -- this profile's `environment_variables:` block below
# unconditionally interpolates `cluster_hostname`, so a "dns disabled, no
# hostname strategy at all" shape would make that a genuine, immediate
# config error instead of a deferred render.
hostname:
  strategy: "provider_host"

# Provider-agnostic cluster specification
cluster_spec:
  node_specification:
    cpu_cores: 2
    memory_gb: 4
    disk_gb: 30
    region_hint: "europe-west"

  cluster_config:
    node_count: 1
    ttl_hours: 4
    tags: ["ephemeral", "example"]
    kubernetes_version: "stable"

  # Ingress configuration -- a SIBLING of cluster_config, not nested inside
  # it (three of the four shipped profiles use this shape).
  ingress_strategy:
    type: "traefik"

    traefik:
      enabled: true
      expose_method: "hostport"
      http_port: 80
      https_port: 443

# DNS configuration - disabled for this profile
dns:
  enabled: false

# SSL/TLS configuration - enabled with Traefik's default self-signed
# certificate (no certresolver annotation = Traefik uses an auto-generated
# self-signed cert)
ssl:
  enabled: true

# Auto-snapshot configuration
auto_snapshot:
  enabled: true
  name_pattern: "auto-{cluster_slug}-{date}"

services:
  exampleco-api:
    repository: "exampleco-api"
    port: 8000
    replicas: 1
    required: true

  postgres:
    repository: "postgres"
    port: 5432
    replicas: 1
    external: true
    required: true
    image_override: "postgres:16-alpine"
    deploy_wave: 1
    persistence:
      type: "postgres"
      database: "exampleco"
      username: "exampleco"
      migration_service: "exampleco-migrations"

  cache:
    repository: "redis"
    port: 6379
    replicas: 1
    external: true
    required: true
    image_override: "redis:7-alpine"
    deploy_wave: 1

  minio:
    repository: "minio"
    port: 9000
    replicas: 1
    external: true
    required: true
    image_override: "minio/minio:latest"
    deploy_wave: 1

  exampleco-migrations:
    repository: "exampleco-migrations"
    port: 0
    replicas: 0
    external: false
    required: true
    migration_type: job
    deploy_wave: 2

  rbac:
    repository: "rbac"
    port: 0
    replicas: 0
    external: true
    required: true
    image_override: "none"

environment_variables:
  shared:
    CLUSTER_ID: "{{ cluster_id }}"
    LOG_JSON: "false"
    APP_PUBLIC_URL: "https://{{ cluster_hostname }}"
    WEBHOOK_CALLBACK_URL: "https://{{ cluster_hostname }}/webhooks"

  services:
    exampleco-api:
      SERVICE_NAME: "exampleco-api"
      DATABASE_HOST: "postgres.default.svc.cluster.local"
      DATABASE_PORT: "5432"
      DATABASE_NAME: "exampleco"
      DATABASE_USERNAME: "exampleco"
      CACHE_HOST: "cache.default.svc.cluster.local:6379"
      S3_HOST: "minio.default.svc.cluster.local:9000"
      API_BASE_URL: "https://{{ cluster_hostname }}/api"
      ADMIN_DASHBOARD_URL: "https://{{ cluster_hostname }}/admin"
      REDIRECT_URI: "https://{{ cluster_hostname }}/*"

    postgres:
      POSTGRES_DB: "exampleco"
      POSTGRES_USER: "exampleco"

    cache:

    minio:
      MINIO_ROOT_USER: "dev-minio-access-key"

    exampleco-migrations:
      database_host: "postgres.default.svc.cluster.local"
      database_port: "5432"
      database_name: "exampleco"
      database_username: "exampleco"
